services:
  postgres:
    image: postgres:18-alpine
    container_name: fluxus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxus_manager}
      POSTGRES_USER: ${POSTGRES_USER:-fluxus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluxus}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails enviados pela API local (SMTP em 1025); caixa de entrada em http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: fluxus-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:

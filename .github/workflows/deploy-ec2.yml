name: Deploy EC2

# Atualiza o servidor da AWS com a main: conecta na EC2 por SSH e roda o deploy/update.sh.
# Chamado pelo CI (job "Deploy (AWS)") num push na main — ou seja, no merge do PR de release
# dev → main —, depois que build e testes passam. Também pode ser disparado manualmente a partir da main.
# Fica desligado até a variável de repositório DEPLOY_EC2_ENABLED=true (ver README → Deploy automático).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Atualizar servidor
    if: vars.DEPLOY_EC2_ENABLED == 'true'
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ec2
      url: http://${{ vars.EC2_HOST }}
    steps:
      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ vars.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          # Remove \r (chave colada no Windows) e espaços nas bordas das linhas.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::O secret EC2_SSH_KEY não é uma chave privada válida. Cole o conteúdo inteiro de ~/.ssh/github_deploy, das linhas -----BEGIN até -----END."
            grep -q -- '-----BEGIN OPENSSH PRIVATE KEY-----' ~/.ssh/deploy_key || echo "Falta a linha -----BEGIN OPENSSH PRIVATE KEY-----"
            grep -q -- '-----END OPENSSH PRIVATE KEY-----' ~/.ssh/deploy_key || echo "Falta a linha -----END OPENSSH PRIVATE KEY-----"
            exit 1
          fi

          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ vars.EC2_HOST }}
          USER: ${{ vars.EC2_USER }}
          APP_DIR: ${{ vars.EC2_APP_DIR || '~/fluxus-manager' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 "$USER@$HOST" \
            "cd $APP_DIR && DEPLOY_BRANCH=main bash deploy/update.sh"

      - name: Verificar de fora
        run: |
          for _ in $(seq 1 10); do
            curl -fsS "http://${{ vars.EC2_HOST }}/api/health" && exit 0
            sleep 5
          done
          echo "API não respondeu em http://${{ vars.EC2_HOST }}/api/health"
          exit 1

name: Deploy staging

# Roda depois do CI verde na dev (ou manualmente). Fica desligado até a infra existir:
# a variável de repositório DEPLOY_STAGING_ENABLED é criada pelo infra/scripts/sync-github-vars.sh.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC → AWS

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  api:
    name: API (build + deploy na EC2)
    if: >-
      vars.DEPLOY_STAGING_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build e push da imagem arm64
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar artefatos de deploy
        run: aws s3 cp deploy/ec2/ "s3://${{ vars.ARTIFACTS_BUCKET }}/deploy/" --recursive

      - name: Deploy na EC2 (SSM)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          commands=$(jq -cn \
            --arg bucket "${{ vars.ARTIFACTS_BUCKET }}" --arg sha "$SHA" \
            --arg region "${{ vars.AWS_REGION }}" --arg image "${{ vars.ECR_REPOSITORY_URL }}" \
            '{commands: [
              "aws s3 cp s3://\($bucket)/deploy/ /opt/fluxus/ --recursive --region \($region)",
              "bash /opt/fluxus/deploy.sh \($sha) staging \($region) \($image)"
            ]}')

          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $SHA" \
            --parameters "$commands" --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Status: $status"
          [ "$status" = "Success" ]

      - name: Verificar pelo CloudFront
        run: |
          for _ in $(seq 1 20); do
            curl -fsS "${{ vars.APP_URL }}/api/health" && exit 0
            sleep 6
          done
          echo "API não respondeu em ${{ vars.APP_URL }}/api/health"
          exit 1

  frontend:
    name: Frontend (S3 + CloudFront)
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar no S3
        working-directory: frontend/dist
        run: |
          bucket="s3://${{ vars.FRONTEND_BUCKET }}"
          # Arquivos com hash no nome: cache longo. index.html: sempre revalidar.
          aws s3 sync . "$bucket" --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp index.html "$bucket/index.html" --cache-control "no-cache"

      - name: Invalidar cache do CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/" --query Invalidation.Id --output text

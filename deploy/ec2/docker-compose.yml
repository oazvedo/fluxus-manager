# Stack da EC2 (API + PostgreSQL). Copiado para /opt/fluxus a cada deploy; as variáveis vêm do .env
# gerado pelo deploy.sh (tag da imagem e senha do banco lida do SSM).
name: fluxus

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxus_manager
      POSTGRES_USER: fluxus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - /data/postgres:/var/lib/postgresql # volume EBS com snapshot diário
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxus -d fluxus_manager"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: ${API_IMAGE:?}:${API_IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?}
      PathBase: /api
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fluxus_manager;Username=fluxus;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
    ports:
      - "80:8080"
    logging: *logging

# Deploy em um servidor (ex.: EC2): banco + API + frontend, tudo construído na própria máquina.
#   cp deploy/.env.example deploy/.env   (troque a senha, gere JWT_SIGNING_KEY com openssl rand -hex 32 e configure o SMTP em EMAIL_*)
#   docker compose -f deploy/docker-compose.yml up -d --build
# Acesso: http://<ip-do-servidor>/ (frontend) e http://<ip-do-servidor>/api/swagger (API)
name: fluxus

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxus_manager
      POSTGRES_USER: fluxus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxus -d fluxus_manager"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      PathBase: /api
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=fluxus_manager;Username=fluxus;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?configure JWT_SIGNING_KEY em deploy/.env}
      Frontend__Url: ${PUBLIC_URL:?configure PUBLIC_URL em deploy/.env}
      Email__Host: ${EMAIL_HOST:?configure EMAIL_HOST em deploy/.env}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Seguranca: ${EMAIL_SEGURANCA:-StartTls}
      Email__Usuario: ${EMAIL_USUARIO:-}
      Email__Senha: ${EMAIL_SENHA:-}
      Email__RemetenteEmail: ${EMAIL_REMETENTE:?configure EMAIL_REMETENTE em deploy/.env}
    logging: *logging

  web:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    logging: *logging

volumes:
  postgres-data:
